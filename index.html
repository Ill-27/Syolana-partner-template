<!doctype html>
<html lang="ru" class="partner-booting">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="color-scheme" content="dark" />
  <meta name="theme-color" content="#030309" />
  <meta name="description" content="Авторский сайт" />
  <title>Имя проекта</title>
  <style id="partner-boot-critical">
    html.partner-booting body{margin:0;background:#030309;overflow:hidden}
    html.partner-booting body>*:not(#partner-boot){visibility:hidden}
    #partner-boot{position:fixed;inset:0;z-index:2147483647;display:grid;place-items:center;background:radial-gradient(circle at 50% 38%,#2a173a 0,transparent 38%),#030309;transition:opacity .28s ease}
    #partner-boot[hidden]{display:none}
    .partner-boot-dots{display:flex;gap:9px}
    .partner-boot-dots i{width:7px;height:7px;border-radius:50%;background:#d5b7ff;opacity:.35;animation:partnerBoot 1.15s ease-in-out infinite}
    .partner-boot-dots i:nth-child(2){animation-delay:.14s}.partner-boot-dots i:nth-child(3){animation-delay:.28s}
    @keyframes partnerBoot{50%{opacity:1;transform:translateY(-4px)}}
    @media(prefers-reduced-motion:reduce){.partner-boot-dots i{animation:none}}
  </style>
  <script>
    document.documentElement.classList.add("partner-booting");
    window.__partnerBootState={content:false,platform:false};
    window.__partnerBootDone=function(part){
      if(window.__partnerBootState) window.__partnerBootState[part]=true;
      const s=window.__partnerBootState||{};
      if(!s.content||!s.platform) return;
      const boot=document.getElementById("partner-boot");
      if(boot){boot.style.opacity="0";setTimeout(()=>boot.remove(),300)}
      document.documentElement.classList.remove("partner-booting");
    };
    setTimeout(()=>{
      window.__partnerBootState={content:true,platform:true};
      window.__partnerBootDone("content");
      window.__partnerBootDone("platform");
    },4500);
  </script>
  <link rel="stylesheet" href="./styles.css" />

  <noscript>
    <style>
      html.partner-booting body { overflow: auto; }
      html.partner-booting body > :not(#partner-boot) { visibility: visible !important; }
      #partner-boot { display: none !important; }
    </style>
  </noscript>
</head>
<body>
  <div id="partner-boot" aria-hidden="true"></div>
  <a class="skip-link" href="#feed">К публикациям</a>

  <header class="site-header glass">
    <a class="brand" href="#top" aria-label="На главную">
      <span id="brand-mark" class="brand-mark" aria-hidden="true">•</span>
      <span class="brand-copy">
        <strong id="brand-name">Имя проекта</strong>
        <small id="brand-tagline">Авторский сайт</small>
      </span>
    </a>
    <nav class="site-nav" aria-label="Основная навигация">
      <a href="#feed">Публикации</a>
      <a href="#about">О проекте</a>
    </nav>
  </header>

  <main id="top">
    <section class="hero glass">
      <p class="eyebrow">АВТОРСКОЕ ПРОСТРАНСТВО</p>
      <h1 id="partner-name" class="partner-title">Загрузка…</h1>
      <p id="partner-tagline" class="tagline"></p>
      <p id="partner-description" class="description"></p>
      <div id="partner-links" class="actions"></div>
    </section>

    <section id="contact" class="contact-panel glass" hidden>
      <div>
        <p class="eyebrow">СВЯЗАТЬСЯ</p>
        <h2>Контакты проекта</h2>
      </div>
      <div id="partner-contacts" class="contact-actions" aria-label="Контакты партнёра"></div>
    </section>

    <section id="feed" class="section">
      <div class="section-heading">
        <div>
          <p class="eyebrow">ПУБЛИКАЦИИ</p>
          <h2>Последнее</h2>
        </div>
        <div id="category-filter" class="filters" aria-label="Фильтр публикаций"></div>
      </div>
      <div id="feed-list" class="feed-grid"></div>
    </section>

    <section id="about" class="glass about">
      <p class="eyebrow">О ПРОЕКТЕ</p>
      <p id="about-owner">
        Этот сайт и опубликованные материалы принадлежат его владельцу.
      </p>
    </section>
  </main>

  <footer>
    <span id="footer-owner">Владелец сайта</span>
    <span>©</span>
    <span id="footer-note">Все права защищены.</span>
  </footer>

  <script type="module" src="./app.js"></script>
  <script type="module" src="./platform-loader.js"></script>
</body>
</html>
