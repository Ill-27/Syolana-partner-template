<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="color-scheme" content="dark" />
  <meta name="theme-color" content="#06070d" />
  <meta name="description" content="Творческий сайт" />
  <title>Творческий сайт</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="base-background" aria-hidden="true"></div>

  <div class="partner-site-shell">
    <header class="partner-site-header glass">
      <a class="partner-brand" href="#top" aria-label="На главную">
        <span class="partner-brand-mark" aria-hidden="true">✦</span>
        <span id="brand-name">Проект</span>
      </a>
      <nav aria-label="Основная навигация">
        <a href="#feed">Публикации</a>
        <a href="#about">О проекте</a>
      </nav>
    </header>

    <div class="partner-content">
      <div id="syolana-banner-slot" hidden></div>

      <main id="top">
        <section class="hero glass">
          <p class="eyebrow">ТВОРЧЕСКИЙ ПРОЕКТ</p>
          <h1 id="partner-name">Загрузка…</h1>
          <p id="partner-tagline" class="tagline"></p>
          <p id="partner-description" class="description"></p>
          <div id="partner-links" class="actions"></div>
        </section>

        <section id="feed" class="section">
          <div class="section-heading">
            <div>
              <p class="eyebrow">ПУБЛИКАЦИИ</p>
              <h2>Последнее</h2>
            </div>
            <div id="category-filter" class="filters" aria-label="Фильтр публикаций"></div>
          </div>
          <div id="feed-list" class="feed-grid"></div>
        </section>

        <section id="about" class="glass about">
          <p class="eyebrow">О САЙТЕ</p>
          <h2>Пространство автора</h2>
          <p id="about-copy">
            Здесь собраны публикации, материалы и ссылки владельца проекта.
          </p>
        </section>
      </main>

      <footer>
        <span id="footer-owner">Владелец сайта</span>
        <span>·</span>
        <span id="footer-note">Творческий сайт</span>
      </footer>
    </div>
  </div>

  <script type="module" src="./app.js"></script>
</body>
</html>
