<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="color-scheme" content="dark" />
  <meta name="description" content="Авторский сайт" />
  <title>Авторский сайт</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="ambient" aria-hidden="true"></div>

  <header class="site-header">
    <a class="brand" href="#top" aria-label="На главную">
      <span id="brand-mark" class="brand-mark" aria-hidden="true"></span>
      <span id="brand-name">Проект</span>
    </a>
    <nav aria-label="Основная навигация">
      <a href="#feed">Публикации</a>
      <a href="#about">О проекте</a>
    </nav>
  </header>

  <main id="top">
    <section class="hero glass">
      <p class="eyebrow">АВТОРСКОЕ ПРОСТРАНСТВО</p>
      <h1 id="partner-name">Загрузка…</h1>
      <p id="partner-tagline" class="tagline"></p>
      <p id="partner-description" class="description"></p>
      <div id="partner-links" class="actions"></div>
    </section>

    <section id="feed" class="section">
      <div class="section-heading">
        <div>
          <p class="eyebrow">ПУБЛИКАЦИИ</p>
          <h2>Последнее</h2>
        </div>
        <div id="category-filter" class="filters" aria-label="Фильтр публикаций"></div>
      </div>
      <div id="feed-list" class="feed-grid"></div>
    </section>

    <section id="about" class="glass about">
      <p class="eyebrow">О САЙТЕ</p>
      <p>
        Домен, хостинг и опубликованные материалы находятся под управлением
        владельца этого сайта.
      </p>
    </section>
  </main>

  <footer>
    <span id="footer-owner">Владелец сайта</span>
    <span>·</span>
    <span id="footer-note">Авторский сайт</span>
  </footer>

  <script type="module" src="./app.js"></script>
</body>
</html>
