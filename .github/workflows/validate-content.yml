name: Validate partner content

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate and build feed
        run: node scripts/build-feed.mjs

      - name: Build active integration
        run: node scripts/build-site.mjs

      - name: Prove clean offboarding
        env:
          SYOLANA_FORCE_MODE: inactive
          DIST_DIR: .dist-off
        run: node scripts/build-site.mjs

      - name: Verify independent build has no platform brand
        shell: bash
        run: |
          if grep -Rni --exclude-dir=media --exclude='*.ogg' --exclude='*.m4a' 'syolana' .dist-off; then
            echo "Brand reference found in independent build"
            exit 1
          fi
          echo "Independent build is clean."
