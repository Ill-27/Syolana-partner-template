name: Validate partner content

on:
  push:
    branches: [main]
    paths:
      - "partner.json"
      - "syolana.json"
      - "posts/**"
      - "scripts/build-feed.mjs"
  pull_request:
    paths:
      - "partner.json"
      - "syolana.json"
      - "posts/**"
      - "scripts/build-feed.mjs"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate and build feed
        run: node scripts/build-feed.mjs
