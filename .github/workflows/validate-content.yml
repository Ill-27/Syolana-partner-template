name: Validate partner site

on:
  push:
    branches: [main]
    paths:
      - "partner.json"
      - "feed.json"
      - "integration.json"
      - "scripts/build-feed.mjs"
      - "scripts/sync-vk-feed.mjs"
      - "app.js"
      - "platform-loader.js"
      - "studio/**"
      - "backend/**"
  pull_request:
    paths:
      - "partner.json"
      - "feed.json"
      - "integration.json"
      - "scripts/build-feed.mjs"
      - "scripts/sync-vk-feed.mjs"
      - "app.js"
      - "platform-loader.js"
      - "studio/**"
      - "backend/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate partner and derived VK feed
        run: node scripts/build-feed.mjs

      - name: Syntax-check browser, sync and serverless code
        shell: bash
        run: |
          node --check studio/studio.js
          node --check backend/studio-api/index.mjs
          node --check scripts/sync-vk-feed.mjs
          node --check scripts/build-site.mjs

      - name: Check optional integration config
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require("fs");
          if (!fs.existsSync("integration.json")) {
            console.log("Standalone site: no integration config.");
            process.exit(0);
          }
          const cfg = JSON.parse(fs.readFileSync("integration.json", "utf8"));
          const modes = new Set(["off","preview","active"]);
          if (!modes.has(cfg.mode)) throw new Error("integration.json: invalid mode");
          if (!cfg.partnerId) throw new Error("integration.json: partnerId is required");
          if (cfg.mode !== "off") {
            const url = new URL(cfg.coreUrl);
            if (url.protocol !== "https:") throw new Error("integration.json: coreUrl must be https");
          }
          if (cfg.mode === "active") {
            const url = new URL(cfg.licenseEndpoint);
            if (url.protocol !== "https:") throw new Error("integration.json: licenseEndpoint must be https");
          }
          console.log("Integration config is valid.");
          NODE
