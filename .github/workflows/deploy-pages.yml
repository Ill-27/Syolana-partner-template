name: Deploy partner site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate and build feed
        run: node scripts/build-feed.mjs
      - name: Build public site artifact
        shell: bash
        run: |
          rm -rf _site
          mkdir -p _site
          cp index.html app.js styles.css partner.json feed.json robots.txt _site/
          if [ -f platform-loader.js ]; then cp platform-loader.js _site/; fi
          if [ -f integration.json ]; then cp integration.json _site/; fi
          if [ -d media ]; then cp -R media _site/media; fi
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
