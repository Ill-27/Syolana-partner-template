name: Import VK posts as drafts

on:
  workflow_dispatch:
  schedule:
    - cron: "23 * * * *"

permissions:
  contents: write

concurrency:
  group: vk-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check whether VK import is configured
        id: gate
        env:
          VK_OWNER_ID: ${{ vars.VK_OWNER_ID }}
          VK_ACCESS_TOKEN: ${{ secrets.VK_ACCESS_TOKEN }}
        shell: bash
        run: |
          if [ -n "$VK_OWNER_ID" ] && [ -n "$VK_ACCESS_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "VK import is not configured; skipping."
          fi

      - name: Import public posts from partner-owned VK wall
        if: steps.gate.outputs.enabled == 'true'
        env:
          VK_OWNER_ID: ${{ vars.VK_OWNER_ID }}
          VK_ACCESS_TOKEN: ${{ secrets.VK_ACCESS_TOKEN }}
          VK_API_VERSION: ${{ vars.VK_API_VERSION }}
          VK_IMPORT_COUNT: "12"
        run: node scripts/import-vk-drafts.mjs

      - name: Commit new drafts
        if: steps.gate.outputs.enabled == 'true'
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- drafts/vk)" ]; then
            echo "No new VK drafts."
            exit 0
          fi
          git config user.name "Syolana VK importer"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add drafts/vk
          git commit -m "Import VK posts as drafts"
          git push
