name: Sync public VK feed

on:
  workflow_dispatch:
  schedule:
    - cron: "23 * * * *"

permissions:
  contents: write

concurrency:
  group: vk-feed-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check VK connection
        id: gate
        env:
          VK_OWNER_ID: ${{ vars.VK_OWNER_ID }}
          VK_ACCESS_TOKEN: ${{ secrets.VK_ACCESS_TOKEN }}
        shell: bash
        run: |
          if [ -n "$VK_OWNER_ID" ] && [ -n "$VK_ACCESS_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "VK sync is not configured; skipping."
          fi

      - name: Read only public posts from partner VK
        if: steps.gate.outputs.enabled == 'true'
        env:
          VK_OWNER_ID: ${{ vars.VK_OWNER_ID }}
          VK_ACCESS_TOKEN: ${{ secrets.VK_ACCESS_TOKEN }}
          VK_API_VERSION: ${{ vars.VK_API_VERSION }}
          VK_POST_COUNT: "20"
        run: node scripts/sync-vk-feed.mjs

      - name: Validate derived feed
        if: steps.gate.outputs.enabled == 'true'
        run: node scripts/build-feed.mjs

      - name: Commit derived feed only
        if: steps.gate.outputs.enabled == 'true'
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- feed.json)" ]; then
            echo "Public VK feed is already current."
            exit 0
          fi
          git config user.name "Partner VK sync"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feed.json
          git commit -m "Sync public VK feed"
          git push
