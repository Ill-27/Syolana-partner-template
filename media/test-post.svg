<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Свет в мастерской</title>
<desc id="desc">Абстрактное изображение тёплого света и бумажных форм на тёмном фоне.</desc>
<defs>
  <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
    <stop offset="0" stop-color="#171225"/>
    <stop offset=".52" stop-color="#31213d"/>
    <stop offset="1" stop-color="#0d1720"/>
  </linearGradient>
  <radialGradient id="glow">
    <stop offset="0" stop-color="#ffe7a8" stop-opacity=".95"/>
    <stop offset=".35" stop-color="#d8a6ff" stop-opacity=".55"/>
    <stop offset="1" stop-color="#8fc9ff" stop-opacity="0"/>
  </radialGradient>
  <filter id="blur"><feGaussianBlur stdDeviation="28"/></filter>
</defs>
<rect width="1600" height="900" fill="url(#bg)"/>
